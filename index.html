<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Design</title>
    <style>
        /* কার্ডের মূল স্টাইল */
        .product-card {
            width: 280px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border: 1px solid #eee;
            margin: 20px auto;
        }

        /* মাউস নিলে কার্ডটি একটু উপরে উঠে আসবে */
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* ইমেজের অংশ */
        .product-image {
            width: 100%;
            height: 200px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-image img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* ডিসকাউন্ট ব্যাজ (অপশনাল) */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff4757;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
        }

        /* পণ্যের তথ্যের অংশ */
        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-category {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .product-title {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
            font-weight: 600;
        }

        .price {
            font-size: 20px;
            color: #2ea44f;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* বাটন স্টাইল */
        .buy-btn {
            background-color: #0366d6;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .buy-btn:hover {
            background-color: #024ea1;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <div class="product-image">
            <span class="badge">NEW</span>
            <img src="n.png" alt="Product Image">
        </div>
        
        <div class="product-info">
            <span class="product-category">Networking Lab</span>
            <h2 class="product-title">Router & PC Setup</h2>
            <div class="price">Free Source</div>
            <a href="#" class="buy-btn">View Project</a>
        </div>
    </div>

</body>
</html>
